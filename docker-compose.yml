#
# Proxy server
#
services:
  tor:
    image: glogol/tor-privoxy:latest
    deploy:
      mode: replicated
      replicas: 4
    configs:
      - source: torrc
        target: /etc/tor/torrc.example
        uid: "101"
        gid: "102"
        mode: 0400
      - source: obfsList
        target: /etc/tor/obfs4.list
        uid: "101"
        gid: "102"
        mode: 0400
      - source: webtunelList
        target: /etc/tor/webtunnel.list
        uid: "101"
        gid: "102"
        mode: 0400
      - source: privoxy
        target: /etc/privoxy/config
        uid: "100"
        gid: "101"
        mode: 0660
      - source: bridgeSelection
        target: /etc/tor/bst.sh
        uid: "101"
        gid: "102"
        mode: 0400
    environment:
      BRIDGES_COUNT: 2
    command: ["sh", "-c", "sh /etc/tor/bst.sh && /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf"]
    healthcheck:
      test: ["CMD", "curl", "--socks5-hostname", "127.0.0.1:9050", "-fsS", "--connect-timeout", "10", "https://check.torproject.org/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
  haproxy:
    image: glogol/haproxy:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    hostname: haproxy
    configs:
      - source: haproxy
        target: /etc/haproxy/haproxy.cfg
        uid: "99"
        gid: "99"
        mode: 0400
  envoy:
    image: envoyproxy/envoy:distroless-v1.37-latest
    dns:
      - 172.16.10.2
      - 172.16.10.3
    hostname: envoy
    ports:
      - target: 15001
        published: 15001
        protocol: tcp
        mode: host
      - target: 15001
        published: 15001
        protocol: udp
        mode: host
    deploy:
      mode: global
    configs:
      - source: envoy
        target: /etc/envoy.yaml
        uid: "65532"
        gid: "65532"
        mode: 444
    command: ["-c", "/etc/envoy.yaml"]
  vpn:
    image: glogol/strongswan:latest
    hostname: vpn
    cap_add:
      - NET_ADMIN
    ports:
      - target: 500
        published: 500
        protocol: udp
        mode: host
      - target: 4500
        published: 4500
        protocol: udp
        mode: host
    configs:
      - source: vpn
        target: /etc/ipsec.conf
        uid: "0"
        gid: "0"
        mode: 6440
  squid:
    image: glogol/squid:latest
    dns:
      - 172.16.10.2
      - 172.16.10.3
    hostname: squid
    environment:
      TZ: Europe/Moscow
    deploy:
      mode: global
    ports:
    - target: 3128
      published: 31288
      protocol: tcp
      mode: host
    - target: 3128
      published: 31288
      protocol: udp
      mode: host
    volumes:
    - type: bind
      source: ./squid/squid.conf
      target: /etc/squid/squid.conf
    - type: bind
      source: ./squid/outside_law
      target: /etc/squid/outside_law
    - type: bind
      source: ./squid/within_law
      target: /etc/squid/within_law
    - type: bind
      source: ./squid/within_law_ip
      target: /etc/squid/within_law_ip
    - type: bind
      source: ./squid/ru-ru
      target: /usr/share/squid/errors/ru-ru

configs:
  torrc:
    file: ./tor/torrc
  obfsList:
    file: ./.obfs4
  webtunelList:
    file: ./.webtunel
  privoxy:
    file: ./tor/privoxy
  bridgeSelection:
    file: ./tor/bst.sh
  haproxy:
    file: ./haproxy/config
  envoy:
    file: ./envoy/envoy.yaml
  vpn:
    file: ./vpn/ipsec.conf