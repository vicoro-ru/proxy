#
# Списки подсетей 
#
acl cnppm src 172.16.10.0/26   # Managment
acl cnppm src 172.16.10.96/27  # Servers
acl cnppm src 172.16.15.0/25   # Hikvision
acl cnppm src 172.16.11.0/26   # Employees
acl cnppm src 172.16.11.128/26 # Telephony
acl cnppm src 172.16.12.0/25   # LAN Auditories
acl cnppm src 172.16.12.128/25 # Wi-Fi Auditories
acl cnppm src 172.16.13.0/24   # Wi-Fi CNPPM
acl cnppm src 172.18.0.1       # Mike

# VIRO
acl viro src 192.168.0.0/24

# Full access
acl fa src 172.16.10.0/26  # Man CNPPM
acl fa src 192.168.0.0/24  # VIRO
acl fa src 172.18.0.1      # Mike

# Limited access
acl la src 172.16.11.0/26
acl la src 172.16.12.0/25
acl la src 172.16.12.128/25
acl la src 172.16.13.0/24



# Ядро запущенного прокси
coredump_dir /var/cache/squid

# Изменить расположение css стилей для страниц squid
# err_page_stylesheet /usr/local/squid/etc/errorpage.css 

# Списки порталов которые запускаются либо через прокси, либо через Tor
acl tor-list dstdomain "/etc/squid/tor-acl"
# Позволяет использовать родительсткие прокси
acl non-prohibited dstdomain "/etc/squid/non-prohibited"

# Порт на котором принимать запросы от клиентов
http_port 0.0.0.0:3128

# Подпрокси HAProxy как родительский 
# имя родительского прокси "haproxy", доступен на 8118 порту
# ему присвоено имя tor-proxy
# перенаправлять туда https только
# PASSTHRU - не аутентифицировать пользователя как участника прокси Proxy-Authenticate / Proxy-Authorization, а передавать напрямую
cache_peer haproxy parent 8118 0 no-query proxy-only default name=tor-proxy login=PASSTHRU

# С каким исходящим адресом будут обращения, в данном случае все возможные адреса клиентов
# Например клиенты из подсети 10.0.2.0/24 будут использовать исходящий адрес 10.1.0.2, а все остальные — 10.1.0.3
# acl good_service_net src 10.0.2.0/24
# tcp_outgoing_address 10.1.0.2 good_service_net
# tcp_outgoing_address 10.1.0.3
tcp_outgoing_address 0.0.0.0

# Настройка прокси:
# Правила обрабатываются не попорядку а просто работают по логике их. 
# Если он в списке которые нужно не обрабатывать напрямую 
# но есть правило always_direct разрешающее обрабатывать напрямую 
# все даже не исключая нужные сайты, то он попробует это сделать 
# (взаимоисключение двух правил, по этому !tor-list важны)

# === Явные запреты для прямого соединения (высший приоритет) ===
# Запретить самому напрямую организовывать соединения
# для доменов из следующих списков tor-list
#
never_direct allow tor-list
never_direct allow non-prohibited

# === Явные разрешения на прямое соединение для всех остальных ===
# Обрабатываю соединения и соединяю напрямую всех
# кроме tor-list
# если не указать исключения то может попробовать соединить
always_direct allow all !tor-list !non-prohibited

# === Разрешение использовать родительские прокси ===
# Позволяет использовать родительсткие прокси tor-proxy
# для следующих списков сайтов tor-list, proxy-list
# !Важно, он не обязан их использовать а лишь может
cache_peer_access tor-proxy allow tor-list

# Сети с различным доступом:
# Люди из списка fa имеют полный доступ
cache_peer_access tor-proxy allow fa tor-list
cache_peer_access tor-proxy allow fa viro
# Люди из остальных подсетей ограниченный доступ
cache_peer_access tor-proxy allow cnppm non-prohibited
# Запрещаю людям из аудиторий доступ к запрещённым в РФ сайтам
http_access deny cnppm tor-list


# Кэш и сколько его хранить
cache_dir ufs /var/cache/squid 100 16 256
refresh_pattern ^ftp:		1440	20%	10080
refresh_pattern -i (/cgi-bin/|\?) 0	0%	0
refresh_pattern .		0	20%	4320


# Файрвол (уровень 7 модели OSI — HTTP)
# Где connect запрос на соединение, get запрос страницы, post отправка данных, (разрешаю подключаться всем локальным)
http_access allow localhost
http_access allow fa
http_access allow viro
http_access deny all