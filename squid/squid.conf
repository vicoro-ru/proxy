# ================= LOCAL NETWORKS =================
acl localnet src 0.0.0.1-0.255.255.255
acl localnet src 10.0.0.0/8
acl localnet src 100.64.0.0/10
acl localnet src 169.254.0.0/16
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

# ================= USER POOLS =================
# Full Access
acl fa src 172.16.10.0/26
acl fa src 192.168.0.0/24
acl fa src 172.18.0.1

# Restricted Access
acl restricted src 172.16.12.0/25
acl restricted src 172.16.12.128/25

# ================= DESTINATION ACLs =================
# FA → Tor for outside-law sites
acl fa_tor dstdomain "/etc/squid/outside_law"

# Restricted → Tor for within-law sites
acl res_tor dstdomain "/etc/squid/within_law"

# ================= HTTP PORT =================
http_port 0.0.0.0:3128
coredump_dir /var/cache/squid

# ================= TOR UPSTREAM =================
cache_peer haproxy parent 8118 0 no-query proxy-only default name=tor-proxy login=PASSTHRU
tcp_outgoing_address 0.0.0.0

# ================= ROUTING LOGIC =================
# FA: outside_law sites → Tor
cache_peer_access tor-proxy allow fa fa_tor
never_direct allow fa fa_tor

# Restricted: within_law sites → Tor
cache_peer_access tor-proxy allow restricted res_tor
never_direct allow restricted res_tor

# Everything else → directly
always_direct allow all !fa_tor !res_tor

# ================= ACCESS RULES =================
# Full access users
http_access allow fa

# Restricted users
http_access allow restricted res_tor
http_access deny restricted

# All other local networks → allow direct to non-Tor
http_access allow localnet
http_access deny all

# ================= CACHE =================
cache_dir ufs /var/cache/squid 100 16 256

refresh_pattern ^ftp:          1440 20% 10080
refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
refresh_pattern .             0 20% 4320