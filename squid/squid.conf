# Стандарные пулы локальных подсетей
# RFC: 1122, 1918, 6598, 3927, 1918, 4193, 4291
acl localnet src 10.0.0.0/8
acl localnet src 100.64.0.0/10
acl localnet src 169.254.0.0/16
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

# Сети центра, менедмент, сеть виро и компьютер Михаила
# имеющие полный доступо к тор сети
acl fullAccess src 172.16.10.0/26
acl fullAccess src 172.17.10.0/26
acl fullAccess src 192.168.0.0/24
acl fullAccess src 192.168.99.0/24

# Сети с ограниченным доступом по законодательству: 
# учебные аудитории, вайфай учебных аудиторий
acl restricted src 172.16.12.0/25
acl restricted src 172.16.12.128/25

# Списки порталов проходящих через тор сеть
# Не нараушающие законодательство:
acl wLaw dstdomain "/etc/squid/within_law"
# Нарушающие законодательство:
acl oLaw dstdomain "/etc/squid/outside_law"


# Какой порт слушать и где хранить ядро
http_port 0.0.0.0:3128
coredump_dir /var/cache/squid

# Указание родительского балансировщика с хост именем haproxy
# имя родительскому прокси присвоено tor-proxy
# работа с ним без авторизации, перенаправка на указанный порт
# адрес исходящего трафика по умолчанию
cache_peer haproxy parent 8118 0 no-query proxy-only default name=tor-proxy
# login=PASSTHRU
tcp_outgoing_address 0.0.0.0

# Разрешаем подключение людей из этих подсетей
# Запрещаем всех остальных
http_access allow localhost
http_access allow localnet
http_access deny all

# Squid'ду не даём разрешение на прямое соединение:
# wLaw oLaw для клиентов из списка fullAccess
# wLaw для клиентов из списка restricted
# never_direct allow fullAccess wLaw oLaw
# never_direct allow restricted wLaw
# never_direct allow wLaw
never_direct allow oLaw


# Обрабатываем все запросы не попавшие под списки выше сами
always_direct allow all !oLaw

# Указываем кто к кому имеет доступ к кеширующему прокси:
# разрешаем людям из сетей fullAccess доступ к tor-proxy для ресурсов из списка wLaw oLaw
# разрешаем людям из сетей restricted доступ к tor-proxy для ресурсов из списка wLaw
# всё остальное запрещаем на доступ к прокси tor-proxy
cache_peer_access tor-proxy allow oLaw
cache_peer_access tor-proxy allow wLaw
# cache_peer_access tor-proxy allow fullAccess wLaw oLaw
# cache_peer_access tor-proxy allow restricted wLaw
# cache_peer_access tor-proxy deny all


# Настройки кэша
cache_dir ufs /var/cache/squid 100 16 256

refresh_pattern ^ftp:          1440 20% 10080
refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
refresh_pattern .             0 20% 4320