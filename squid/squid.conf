# === ACL для сетей ===
# Полный доступ
acl fullAccess src 172.16.10.0/26
acl fullAccess src 172.16.10.96/27
acl fullAccess src 172.16.11.0/26
acl fullAccess src 172.17.0.0/16
acl fullAccess src 172.18.0.0/15
acl fullAccess src 172.20.0.0/14
acl fullAccess src 192.168.0.0/24
acl fullAccess src 192.168.99.0/24
acl fullAccess src 10.0.0.0/16 


# Ограниченный доступ
acl restricted src 172.16.11.128/26
acl restricted src 172.16.12.0/25
acl restricted src 172.16.12.128/25
acl restricted src 172.16.13.0/24


# Ограничения времени чтения и попытки запроса
# Пробывать снова если не получилось
# Пробовать через родителя
connect_timeout 60 seconds
read_timeout 5 minutes
request_timeout 2 minutes
persistent_request_timeout 1 minute

# Списки сайтов
acl wLaw dstdomain "/etc/squid/within_law"
acl oLaw dstdomain "/etc/squid/outside_law"

# === Порты и кэш ===
http_port 0.0.0.0:3128
coredump_dir /var/cache/squid
cache_dir ufs /var/cache/squid 100 16 256
refresh_pattern ^ftp:          1440 20% 10080
refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
refresh_pattern .             0 20% 4320

# === Родительский прокси Tor ===
cache_peer haproxy parent 8118 0 no-query proxy-only default name=tor-proxy protocol=proxy
tcp_outgoing_address 0.0.0.0

# === Доступ к Tor ===
# fullAccess через Tor ко всем спискам
cache_peer_access tor-proxy allow fullAccess oLaw
cache_peer_access tor-proxy allow fullAccess wLaw

# restricted через Tor только к wLaw
cache_peer_access tor-proxy allow restricted wLaw
cache_peer_access tor-proxy deny restricted oLaw

# === Направление трафика (never_direct / always_direct) ===
never_direct allow fullAccess oLaw
never_direct allow fullAccess wLaw
never_direct allow restricted wLaw

# Остальные напрямую
always_direct allow all !oLaw !wLaw

# === HTTP access ===
# localhost всегда разрешаем
http_access allow localhost

# fullAccess: прямой доступ к обычным сайтам + Tor для списков
http_access allow fullAccess

# restricted: прямой доступ к обычным сайтам
http_access allow restricted !oLaw !wLaw

# restricted: Tor только для within_law
http_access allow restricted wLaw

# Все остальные запрещаем
http_access deny all
