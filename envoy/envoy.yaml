static_resources:

  listeners:
  - name: tcp_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 15001

    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config: {}

    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: tcp_out
          cluster: direct_egress

          # retries если зависло
          retry_policy:
            retry_on: connect-failure,refused-stream,reset
            num_retries: 1

          # fallback → Tor
          weighted_clusters:
            clusters:
            - name: direct_egress
              weight: 80
            - name: tor_egress
              weight: 20

  clusters:

  # ====== DIRECT / ISP ======
  - name: direct_egress
    connect_timeout: 3s
    type: ORIGINAL_DST
    lb_policy: CLUSTER_PROVIDED
    upstream_connection_options:
      tcp_keepalive:
        keepalive_time: 10

  # ====== TOR via HAProxy ======
  - name: tor_egress
    connect_timeout: 5s
    type: LOGICAL_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: tor_egress
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: haproxy
                port_value: 8118
