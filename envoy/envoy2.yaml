static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 15001
      listener_filters:
        - name: "envoy.filters.listener.tls_inspector"
          typed_config:
            "@type": ://type.googleapis.com
      
      filter_chains:
        # ПРАВИЛО 1: Прямой выход для .ru (без задержек и туннелей)
        - filter_chain_match:
            server_names: ["*.ru", "*.рф"]
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": ://type.googleapis.com
                stat_prefix: direct_ru
                cluster: direct_rostelecom

        # ПРАВИЛО 2: Все остальное (Умный Fallback)
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": ://type.googleapis.com
                stat_prefix: smart_fallback
                cluster: aggregate_cluster
                # ПОЛИТИКА ПОВТОРОВ:
                # Если первый кластер в агрегаторе вернул ошибку или тайм-аут,
                # Envoy пробует следующий.
                max_connect_attempts: 3 
                idle_timeout: 30s

  clusters:
    # --- АГРЕГАТОР: Дирижер шлюзов ---
    - name: aggregate_cluster
      cluster_type:
        name: envoy.clusters.aggregate
        typed_config:
          "@type": ://type.googleapis.com
          clusters:
            - primary_rostelecom  # Приоритет 0
            - secondary_provider # Приоритет 1 (другой офис)
            - home_rpi_tunnel    # Приоритет 2 (крайний случай)

    # ШЛЮЗ 1: Основной (с коротким ожиданием)
    - name: primary_rostelecom
      # Если за 2с не соединились - Envoy пробует следующий шлюз
      connect_timeout: 2s
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      # Важно для L4: если данных нет 3с, закрываем поток для переключения
      common_http_protocol_options:
        idle_timeout: 3s
      outlier_detection:
        # Выкидываем IP из списка живых при первом же таймауте (idle_timeout)
        consecutive_gateway_failure: 1 
        # На сколько времени "забыть" про этот IP для прямого шлюза
        base_ejection_time: 5m 
        # Можно выкинуть хоть 100% проблемных IP (по умолчанию 10%)
        max_ejection_percent: 100
        # Проверять состояние каждые 10 секунд
        interval: 10s

    # ШЛЮЗ 2: Другой офис (запасной)
    - name: secondary_provider
      connect_timeout: 3s
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      common_http_protocol_options:
        idle_timeout: 5s

    # ШЛЮЗ 3: Домашний туннель (надежный, но медленный)
    - name: home_rpi_tunnel
      connect_timeout: 10s
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      # Здесь тайм-аут большой, даем контенту докачаться
      common_http_protocol_options:
        idle_timeout: 60s

    # ПРЯМОЙ ВЫХОД: Для зоны .ru
    - name: direct_rostelecom
      connect_timeout: 5s
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED

